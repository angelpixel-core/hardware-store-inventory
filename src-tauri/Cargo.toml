[package]
name = "hardware_store_inventory"
version = "0.1.0"
description = "Hardware store inventory desktop application"
authors = ["Angel"]
edition = "2021"

[lib]
name = "hardware_store_inventory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
